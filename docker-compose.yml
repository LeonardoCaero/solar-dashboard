services:
  solar_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solar_api
    restart: unless-stopped
    ports:
      - "4100:8000"   # LAN-reachable — no reverse proxy in front yet
    env_file:
      - ./backend/.env
    networks:
      - solar_net

  solar_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # browser calls this directly, so it must be the NAS's LAN IP, not
        # the Docker service name — change if the NAS's IP ever changes,
        # or once you put a reverse proxy in front (see README) and can
        # go back to the relative "/api" default.
        VITE_API_URL: ${VITE_API_URL:-http://192.168.1.101:4100/api}
    container_name: solar_frontend
    restart: unless-stopped
    ports:
      - "8081:80"   # LAN-reachable — no reverse proxy in front yet
    depends_on:
      - solar_api
    networks:
      - solar_net

networks:
  solar_net:
    driver: bridge
